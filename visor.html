<!doctype html> 
<html lang="es"> 
  <head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Parámetros del Emisor - Visor</title> 
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> 
    <style> 
      :root { 
        --naranja: #ff6c0c; 
        --gris: #4f4f4f; 
        --fondo: #f2f2f2; 
        --borde: #d9d9d9; 
        --azul: #2457a7; 
      } 
 
      * { 
        box-sizing: border-box; 
      } 
 
      body { 
        margin: 0; 
        background: var(--fondo); 
        color: #333; 
        font-family: "Segoe UI", Arial, sans-serif; 
      } 
 
      button, 
      input, 
      textarea, 
      select { 
        font: inherit; 
      } 
 
      button { 
        cursor: pointer; 
      } 
 
      .encabezado { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        gap: 12px; 
        flex-wrap: wrap; 
        padding: 13px 22px; 
        background: white; 
        border-bottom: 1px solid var(--borde); 
      } 
 
      .encabezado h1 { 
        margin: 0; 
        color: var(--naranja); 
        font-size: 34px; 
        font-weight: 300; 
      } 
 
      .subtitulo { 
        color: #666; 
        font-size: 13px; 
      } 
 
      .acciones, 
      .pestanas { 
        display: flex; 
        gap: 8px; 
        flex-wrap: wrap; 
        align-items: center; 
      } 
 
      .boton { 
        padding: 9px 13px; 
        border: 0; 
        border-radius: 8px; 
        background: var(--gris); 
        color: white; 
        font-weight: 750; 
      } 
 
      .boton-naranja { 
        background: var(--naranja); 
      } 
 
      .selector-idioma { 
        display: flex; 
        overflow: hidden; 
        border: 1px solid var(--borde); 
        border-radius: 999px; 
        background: white; 
      } 
 
      .selector-idioma button { 
        padding: 8px 13px; 
        border: 0; 
        background: transparent; 
        color: var(--gris); 
        font-weight: 800; 
      } 
 
      .selector-idioma button.activo { 
        background: var(--naranja); 
        color: white; 
      } 
 
      .pestanas { 
        padding: 10px 22px; 
        background: white; 
        border-bottom: 1px solid var(--borde); 
      } 
 
      .pestana { 
        padding: 9px 21px; 
        border: 1px solid #ccc; 
        border-radius: 999px; 
        background: white; 
        color: var(--gris); 
        font-weight: 800; 
      } 
 
      .pestana.activa { 
        border-color: var(--gris); 
        background: var(--gris); 
        color: white; 
      } 
 
      .menu-opciones { 
        display: grid; 
        grid-template-columns: repeat(10, minmax(0, 1fr)); 
        gap: 4px; 
        padding: 7px 22px; 
        background: #fafafa; 
        border-bottom: 1px solid var(--borde); 
      } 
 
      .opcion { 
        height: 26px; 
        overflow: hidden; 
        padding: 3px 5px; 
        border: 1px solid #ccc; 
        border-radius: 14px; 
        background: white; 
        color: var(--gris); 
        font-size: 9.5px; 
        font-weight: 750; 
        text-overflow: ellipsis; 
        white-space: nowrap; 
      } 
 
      .opcion.activa { 
        border-color: var(--naranja); 
        background: var(--naranja); 
        color: white; 
      } 
 
      .filtros { 
        position: sticky; 
        top: 0; 
        z-index: 80; 
        display: grid; 
        grid-template-columns: 2fr repeat(3, 1fr) auto; 
        gap: 8px; 
        padding: 12px 22px;        background: var(--fondo); 
        border-bottom: 1px solid var(--borde); 
        box-shadow: 0 4px 10px #00000012; 
      } 
 
      input, 
      textarea { 
        width: 100%; 
        padding: 10px; 
        border: 1px solid var(--borde); 
        border-radius: 8px; 
        background: white; 
      } 
 
      .estado, 
      .titulo-opcion { 
        padding: 5px 22px; 
      } 
 
      .estado { 
        color: #666; 
        font-size: 13px; 
      } 
 
      .estado.error { 
        color: #b42318; 
      } 
 
      .titulo-opcion { 
        margin: 0; 
        color: #444; 
        font-size: 25px; 
        font-weight: 400; 
      } 
 
      .contenido { 
        padding: 10px 22px 90px; 
      } 
 
      .ficha { 
        margin-bottom: 14px; 
        background: white; 
        border: 1px solid var(--borde); 
        box-shadow: 0 2px 7px #00000012; 
      } 
 
      .ficha-encabezado { 
        display: grid; 
        grid-template-columns: 145px 1fr; 
        border-bottom: 1px solid var(--borde); 
      } 
 
      .codigo { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 10px; 
        background: #595959; 
        color: white; 
        font-weight: 800; 
      } 
 
      .nombre { 
        padding: 10px 15px; 
        color: var(--naranja); 
        font-size: 24px; 
        font-weight: 300; 
      } 
 
      .cuadricula { 
        display: grid; 
        grid-template-columns: repeat(3, minmax(0, 1fr)); 
        gap: 9px; 
        padding: 11px; 
      } 
 
      .campo { 
        min-height: 95px; 
        padding: 10px; 
        background: #fafafa; 
        border: 1px solid #e5e5e5; 
        border-top: 4px solid #bbb; 
      } 
 
      .campo.ejemplo { 
        background: #fff5ec; 
      } 
 
      .etiqueta { 
        margin-bottom: 7px; 
        color: #444; 
        font-size: 11px; 
        font-weight: 850; 
        text-transform: uppercase; 
      } 
 
      .texto { 
        line-height: 1.38; 
        white-space: pre-wrap; 
      } 
 
      mark { 
        padding: 0 1px; 
        background: #fff176; 
        color: #000; 
      } 
 
      .dep-ref-inline { 
        padding: 0 2px; 
        border-bottom: 2px solid var(--naranja); 
        border-radius: 3px; 
        background: #fff0c2; 
        color: #8a3b00; 
        font-weight: 800; 
        text-decoration: none; 
      } 
 
      .sin-resultados { 
        padding: 28px; 
        background: white; 
        border: 1px dashed var(--borde); 
        text-align: center; 
      } 
 
      .boton-preguntas { 
        position: fixed; 
        right: 22px; 
        bottom: 22px; 
        z-index: 90; 
        padding: 12px 18px; 
        border: 0; 
        border-radius: 999px; 
        background: var(--naranja); 
        color: white; 
        font-weight: 850; 
        box-shadow: 0 8px 25px #0004; 
      } 
 
      .panel-preguntas { 
        position: fixed; 
        right: 22px; 
        bottom: 78px; 
        z-index: 100; 
        width: min(430px, calc(100vw - 28px)); 
        max-height: min(650px, calc(100vh - 100px)); 
        overflow: hidden; 
        border: 1px solid var(--borde); 
        border-radius: 16px; 
        background: white; 
        box-shadow: 0 16px 45px #0005; 
      } 
 
      .panel-preguntas[hidden] { 
        display: none; 
      } 
 
      .panel-cabecera { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        gap: 8px; 
        padding: 12px 14px; 
        background: var(--naranja); 
        color: white; 
        cursor: move; 
        user-select: none; 
      } 
 
      .panel-cabecera h2 { 
        margin: 0; 
        font-size: 18px; 
      } 
 
      .panel-cabecera button { 
        border: 0; 
        background: transparent; 
        color: white; 
        font-size: 22px; 
      } 
 
      .panel-cuerpo { 
        max-height: 565px; 
        overflow-y: auto; 
        padding: 14px; 
      } 
 
      .faq-grid { 
        display: grid; 
        gap: 7px; 
        margin-bottom: 13px; 
      } 
 
      .faq { 
        padding: 9px; 
        border: 1px solid var(--borde); 
        border-radius: 9px; 
        background: #fafafa; 
        color: #333; 
        text-align: left; 
      } 
 
      .respuesta { 
        margin-top: 12px; 
        padding: 11px; 
        border-radius: 10px; 
        background: #fff7f0; 
        line-height: 1.4; 
      } 
 
      .recomendacion { 
        display: block; 
        width: 100%; 
        margin: 7px 0; 
        padding: 9px; 
        border: 1px solid #ffd1ad; 
        border-radius: 9px; 
        background: white; 
        color: #333; 
        text-align: left; 
      } 
 
      .recomendacion strong { 
        color: var(--naranja); 
      } 
 
      .nota-ia { 
        margin-top: 8px; 
        color: #666; 
        font-size: 11px; 
      } 
 
      .tarjeta-flotante { 
        position: fixed; 
        z-index: 160; 
        display: none; 
        width: 520px; 
        max-width: calc(100vw - 24px); 
        max-height: 440px; 
        overflow: auto; 
        padding: 12px; 
        background: white; 
        border: 1px solid var(--borde); 
        border-radius: 12px; 
        box-shadow: 0 14px 38px #0005; 
        font-size: 14px; 
      } 
      .tarjeta-flotante h4 { 
        margin: 0; 
        color: var(--naranja); 
        font-size: 18px; 
      } 
      .vista-previa-campo { 
        padding: 7px 0; 
        border-bottom: 1px solid #eee; 
        line-height: 1.35; 
        white-space: pre-wrap; 
      } 
      .vista-previa-campo b { 
        display: block; 
        margin-bottom: 2px; 
        color: var(--gris); 
      } 
      .acciones-flotantes { 
        margin-top: 10px; 
      } 
      @media (max-width: 1050px) { 
        .menu-opciones { 
          grid-template-columns: repeat(8, 1fr); 
        } 
        .cuadricula { 
          grid-template-columns: 1fr 1fr; 
        } 
      } 
 
      @media (max-width: 720px) { 
        .menu-opciones { 
          grid-template-columns: repeat(4, 1fr); 
        } 
        .filtros, 
        .cuadricula { 
          grid-template-columns: 1fr; 
        } 
        .ficha-encabezado { 
          grid-template-columns: 90px 1fr; 
        } 
      } 
    </style> 
  </head> 
  <body> 
    <header class="encabezado"> 
      <div> 
        <h1 id="tituloSistema">Parámetros del Emisor</h1> 
        <div id="subtituloSistema" class="subtitulo"> 
          Consulta de parámetros funcionales 
        </div> 
      </div> 
      <div class="acciones"> 
        <button id="botonExportar" class="boton" onclick="exportarExcel()"> 
          Exportar Excel 
        </button> 
        <div class="selector-idioma"> 
          <button id="idiomaES" class="activo" onclick="cambiarIdioma('es')"> 
            Español 
          </button> 
          <button id="idiomaEN" onclick="cambiarIdioma('en')">English</button> 
        </div> 
      </div> 
    </header> 
 
    <section class="pestanas"> 
      <button 
        id="externo" 
        class="pestana activa" 
        onclick="cambiarAmbito('externo')" 
      > 
        Externo 
      </button> 
      <button id="interno" class="pestana" onclick="cambiarAmbito('interno')"> 
        Interno 
      </button> 
    </section> 
 
    <nav id="menuOpciones" class="menu-opciones"></nav> 
 
    <section class="filtros"> 
      <input 
        id="buscar" 
        placeholder="Buscar por palabra clave en todas las opciones" 
      /> 
      <input id="filtrarNombre" placeholder="Filtrar nombre" /> 
      <input id="filtrarProducto" placeholder="Filtrar producto" /> 
      <input id="filtrarPais" placeholder="Filtrar país" /> 
      <button id="botonLimpiar" class="boton" onclick="limpiarFiltros()"> 
        Limpiar filtros 
      </button> 
    </section> 
 
    <div id="estado" class="estado"></div> 
    <h2 id="tituloOpcion" class="titulo-opcion"></h2> 
    <main id="contenido" class="contenido"></main> 
 
    <button 
      id="botonPreguntas" 
      class="boton-preguntas" 
      onclick="alternarPreguntas()" 
    > 
      ¿Preguntas? 
    </button> 
 
    <aside id="panelPreguntas" class="panel-preguntas" hidden> 
      <div id="panelCabecera" class="panel-cabecera"> 
        <h2 id="tituloPreguntas">¿Preguntas?</h2> 
        <button onclick="alternarPreguntas()">×</button> 
      </div> 
      <div class="panel-cuerpo"> 
        <div id="textoFAQ"><strong>Preguntas frecuentes</strong></div> 
        <div id="faqLista" class="faq-grid"></div> 
        <label id="etiquetaPregunta" for="preguntaLibre" 
          ><strong>¿Qué desea hacer?</strong></label 
        > 
        <textarea 
          id="preguntaLibre" 
          rows="4" 
          placeholder="Ejemplo: Quiero configurar una tarjeta corporativa con renovación" 
        ></textarea> 
        <button 
          id="botonAnalizar" 
          class="boton boton-naranja" 
          onclick="analizarPregunta()" 
        > 
          Buscar parámetros útiles 
        </button> 
        <div id="respuestaIA" class="respuesta" hidden></div> 
        <div id="notaIA" class="nota-ia"> 
          Las recomendaciones se calculan localmente con el contenido 
          disponible. Revise las fichas antes de aplicar una configuración. 
        </div> 
      </div> 
    </aside> 
    <div id="tarjetaDependencia" class="tarjeta-flotante"></div> 
    <script> 
      "use strict"; 
 
      const OPCIONES = [ 
        ["05", "Consultar"], 
        ["12", "Trabajar con"], 
        ["13", "Moneda"], 
        ["14", "Clasificación"], 
        ["15", "Membresías"], 
        ["16", "Cargos Auto"], 
        ["17", "Ciclos"], 
        ["18", "Tipo Cliente"], 
        ["19", "Renovación"], 
        ["20", "Pólizas"], 
        ["21", "Mensajes"], 
        ["22", "Sorteos"], 
        ["23", "Estados"], 
        ["24", "Clases"], 
        ["25", "Trasiego"], 
        ["26", "Cargos I.V."], 
        ["27", "Corporativo"], 
        ["28", "Skip Pay"], 
        ["29", "Diseño"], 
        ["30", "Extrafin."], 
        ["31", "Limpiar"], 
        ["32", "Tipo Cta."], 
        ["33", "Costos"], 
        ["34", "Estados Cta."], 
        ["35", "Excepciones"], 
        ["36", "Origen"], 
        ["38", "No Intereses"], 
        ["39", "Excep."], 
        ["40", "Documentos"], 
        ["42", "Prepago"], 
        ["44", "Reducc."], 
        ["45", "Vence Pago"], 
        ["46", "Copia"], 
        ["47", "Deterioro"], 
        ["48", "Prospecto"], 
        ["49", "Renov. Tarj."], 
        ["50", "Renov. Emisor"], 
        ["52", "Rangos"], 
        ["53", "Tecnología"], 
      ]; 
 
      const TEXTOS = { 
        es: { 
          titulo: "Parámetros del Emisor", 
          subtitulo: "Consulta de parámetros funcionales", 
          externo: "Externo", 
          interno: "Interno", 
          exportar: "Exportar Excel", 
          limpiar: "Limpiar filtros", 
          buscar: "Buscar por palabra clave en todas las opciones", 
          nombre: "Filtrar nombre", 
          producto: "Filtrar producto", 
          pais: "Filtrar país", 
          preguntas: "¿Preguntas?", 
          faq: "Preguntas frecuentes", 
          desea: "¿Qué desea hacer?", 
          placeholderPregunta: 
            "Ejemplo: Quiero configurar una tarjeta corporativa con renovación", 
          analizar: "Buscar parámetros útiles", 
          nota: "Las recomendaciones se calculan localmente con el contenido disponible. Revise las fichas antes de aplicar una configuración.", 
          todas: "Todas", 
          mostrando: "Mostrando", 
          registros: "registro(s)", 
          noResultados: "No hay registros para mostrar.", 
          productoCampo: "Producto", 
          paisCampo: "País", 
          valores: "Valores Permitidos", 
          que: "¿Qué hace?", 
          como: "¿Cómo funciona?", 
          dependencias: "Dependencias / Reglas", 
          cuando: "¿Cuándo aplica?", 
          ejemplo: "Ejemplo Funcional", 
          notas: "Notas Visibles al Cliente", 
          recomendados: "Parámetros recomendados", 
          sinSugerencias: 
            "No encontré coincidencias suficientes. Pruebe con términos más específicos.", 
          abrir: "Abrir ficha", 
        }, 
        en: { 
          titulo: "Issuer Parameters", 
          subtitulo: "Functional parameter reference", 
          externo: "External", 
          interno: "Internal", 
          exportar: "Export to Excel", 
          limpiar: "Clear filters", 
          buscar: "Search by keyword across all options", 
          nombre: "Filter by name", 
          producto: "Filter by product", 
          pais: "Filter by country", 
          preguntas: "Questions?", 
          faq: "Frequently asked questions", 
          desea: "What do you want to do?", 
          placeholderPregunta: 
            "Example: I want to configure a corporate card with renewal", 
          analizar: "Find useful parameters", 
          nota: "Recommendations are calculated locally from the available content. Review the parameter cards before applying a configuration.", 
          todas: "All", 
          mostrando: "Showing", 
          registros: "record(s)", 
          noResultados: "No records to display.", 
          productoCampo: "Product", 
          paisCampo: "Country", 
          valores: "Allowed Values", 
          que: "What does it do?", 
          como: "How does it work?", 
          dependencias: "Dependencies / Rules", 
          cuando: "When does it apply?", 
          ejemplo: "Functional Example", 
          notas: "Customer-visible Notes", 
          recomendados: "Recommended parameters", 
          sinSugerencias: 
            "I did not find enough matches. Try more specific terms.", 
          abrir: "Open card", 
        }, 
      }; 
 
      const FAQ = { 
        es: [ 
          "¿Qué parámetros intervienen en una renovación?", 
          "¿Qué parámetros están relacionados con productos corporativos?", 
          "¿Qué debo revisar para configurar una tarjeta?", 
        ], 
        en: [ 
          "Which parameters are involved in renewal?", 
          "Which parameters relate to corporate products?", 
          "What should I review to configure a card?", 
        ], 
      }; 
 
      const CAMPOS = [ 
        "nombre", 
        "producto", 
        "pais", 
        "valores", 
        "que", 
        "como", 
        "dependencias", 
        "cuando", 
        "ejemplo", 
        "notas", 
      ]; 
      const $ = (id) => document.getElementById(id); 
 
      let idioma = "es"; 
      let etiquetasPersonalizadas = {}; 
      let ambito = "externo"; 
      let opcion = "05"; 
      let datos = {}; 
 
      function normalizar(valor) { 
        return String(valor ?? "") 
          .toLowerCase() 
          .normalize("NFD") 
          .replace(/[\u0300-\u036f]/g, "") 
          .replace(/[^a-z0-9]+/g, " ") 
          .replace(/\s+/g, " ") 
          .trim(); 
      } 
 
      function escapar(valor) { 
        return String(valor ?? "") 
          .replaceAll("&", "&amp;") 
          .replaceAll("<", "&lt;") 
          .replaceAll(">", "&gt;") 
          .replaceAll('"', "&quot;") 
          .replaceAll("'", "&#039;"); 
      } 
 
      function textoPlano(valor) { 
        const temporal = document.createElement("div"); 
        temporal.innerHTML = String(valor ?? ""); 
        return temporal.textContent || ""; 
      } 
 
      function nombreOpcion(codigo) { 
        return OPCIONES.find((item) => item[0] === codigo)?.[1] || ""; 
      } 
 
      function baseIdioma() { 
        if (idioma === "es") { 
          return "./"; 
        } 
 
        if (location.hostname.endsWith(".github.io")) { 
          const usuario = location.hostname.split(".")[0]; 
          return `https://${usuario}.github.io/parametros-emisor-en/`; 
        } 
 
        return "../parametros-emisor-en/"; 
      } 
 
      function ruta(codigo) { 
        return `${baseIdioma()}data/${ambito}/op${codigo}.json`; 
      } 
 
      function todosLosRegistros() { 
        return OPCIONES.flatMap(([codigo]) => 
          (datos[codigo] || []).map((registro) => ({ 
            ...registro, 
            __opcion: codigo, 
          })), 
        ); 
      } 
 
      async function leerOpcion(codigo) { 
        try { 
          const respuesta = await fetch(`${ruta(codigo)}?v=${Date.now()}`, { 
            cache: "no-store", 
          }); 
          if (respuesta.status === 404) return []; 
          if (!respuesta.ok) 
            throw new Error(`${ruta(codigo)} (${respuesta.status})`); 
          const contenido = await respuesta.json(); 
          return Array.isArray(contenido) ? contenido : []; 
        } catch (error) { 
          console.warn(error); 
          return []; 
        } 
      } 
 
      async function cargarDatos() { 
        const t = textosActivos(); 
        $("estado").className = "estado"; 
        $("estado").textContent = 
          idioma === "es" ? "Cargando datos..." : "Loading data..."; 
 
        const pares = await Promise.all( 
          OPCIONES.map(async ([codigo]) => [codigo, await leerOpcion(codigo)]), 
        ); 
 
        datos = Object.fromEntries(pares); 
        construirMenu(); 
        renderizar(); 
        $("estado").textContent = 
          `${t.mostrando} ${todosLosRegistros().length} ${t.registros}.`; 
      } 
 
      async function cargarEtiquetasPersonalizadas() { 
        etiquetasPersonalizadas = {}; 
        if (idioma !== "en") return; 
        try { 
          const respuesta = await fetch( 
            `${baseIdioma()}data/config/labels.json?v=${Date.now()}`, 
            { cache: "no-store" }, 
          ); 
          if (respuesta.ok) etiquetasPersonalizadas = await respuesta.json(); 
        } catch (error) { 
          console.warn("No se pudieron cargar etiquetas personalizadas", error); 
        } 
      } 
 
      function textosActivos() { 
        return idioma === "en" 
          ? { ...TEXTOS.en, ...etiquetasPersonalizadas } 
          : TEXTOS.es; 
      } 
 
      async function cambiarIdioma(nuevoIdioma) { 
        idioma = nuevoIdioma; 
        $("idiomaES").classList.toggle("activo", idioma === "es"); 
        $("idiomaEN").classList.toggle("activo", idioma === "en"); 
        await cargarEtiquetasPersonalizadas(); 
        aplicarTextos(); 
        await cargarDatos(); 
      } 
 
      function aplicarTextos() { 
        const t = textosActivos(); 
        document.documentElement.lang = idioma; 
        document.title = `${t.titulo} - Visor`; 
        $("tituloSistema").textContent = t.titulo; 
        $("subtituloSistema").textContent = t.subtitulo; 
        $("externo").textContent = t.externo; 
        $("interno").textContent = t.interno; 
        $("botonExportar").textContent = t.exportar; 
        $("botonLimpiar").textContent = t.limpiar; 
        $("buscar").placeholder = t.buscar; 
        $("filtrarNombre").placeholder = t.nombre; 
        $("filtrarProducto").placeholder = t.producto; 
        $("filtrarPais").placeholder = t.pais; 
        $("botonPreguntas").textContent = t.preguntas; 
        $("tituloPreguntas").textContent = t.preguntas; 
        $("textoFAQ").innerHTML = `<strong>${t.faq}</strong>`; 
        $("etiquetaPregunta").innerHTML = `<strong>${t.desea}</strong>`; 
        $("preguntaLibre").placeholder = t.placeholderPregunta; 
        $("botonAnalizar").textContent = t.analizar; 
        $("notaIA").textContent = t.nota; 
        construirFAQ(); 
      } 
 
      function cambiarAmbito(nuevoAmbito) { 
        ambito = nuevoAmbito; 
        $("externo").classList.toggle("activa", ambito === "externo"); 
        $("interno").classList.toggle("activa", ambito === "interno"); 
        cargarDatos(); 
      } 
 
      function construirMenu() { 
        const t = textosActivos(); 
        $("menuOpciones").innerHTML = 
          `

      function registrosVisibles() {

        const nombre = normalizar($("filtrarNombre").value); 
        const producto = normalizar($("filtrarProducto").value); 
        const pais = normalizar($("filtrarPais").value); 
        const base = 
          general || opcion === "todas" 
            ? todosLosRegistros() 
            : (datos[opcion] || []).map((registro) => ({ 
                ...registro, 
                __opcion: opcion, 
              })); 
 
        return base.filter((registro) => { 
          const texto = normalizar( 
            CAMPOS.map((campo) => textoPlano(registro[campo])).join(" "), 
          ); 
          return ( 
            (!general || texto.includes(general)) && 
            (!nombre || normalizar(registro.nombre).includes(nombre)) &&

            (!pais || normalizar(registro.pais).includes(pais))

      function resaltar(valor) { 
        let contenido = escapar(textoPlano(valor) || "—"); 
        const consulta = $("buscar").value.trim(); 
        if (!consulta) return contenido; 
        const partes = consulta 
          .split(/\s+/) 
          .filter(Boolean) 
          .map((parte) => parte.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")); 
        return partes.length 
          ? contenido.replace( 
              new RegExp(`(${partes.join("|")})`, "gi"), 
              "<mark>$1</mark>", 
            ) 
          : contenido; 
      } 
 
      function resaltarHTML(valor) { 
        const contenedor = document.createElement("div"); 
        contenedor.innerHTML = String(valor || "—"); 
        const consulta = $("buscar").value.trim(); 
        if (!consulta) return contenedor.innerHTML; 
        const partes = consulta 
          .split(/\s+/) 
          .filter(Boolean) 
          .sort((a, b) => b.length - a.length) 
          .map((parte) => parte.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")); 
        if (!partes.length) return contenedor.innerHTML; 
        const expresion = new RegExp(`(${partes.join("|")})`, "gi"); 
        const caminante = document.createTreeWalker( 
          contenedor, 
          NodeFilter.SHOW_TEXT, 
        ); 
        const nodos = []; 
        while (caminante.nextNode()) nodos.push(caminante.currentNode); 
        nodos.forEach((nodo) => { 
          if (!expresion.test(nodo.nodeValue || "")) { 
            expresion.lastIndex = 0; 
            return; 
          } 
          expresion.lastIndex = 0; 
          const fragmento = document.createDocumentFragment(); 
          let ultimo = 0; 
          (nodo.nodeValue || "").replace(expresion, (coincidencia, _grupo, indice) => { 
            fragmento.appendChild( 
              document.createTextNode(nodo.nodeValue.slice(ultimo, indice)), 
            ); 
            const marca = document.createElement("mark"); 
            marca.textContent = coincidencia; 
            fragmento.appendChild(marca); 
            ultimo = indice + coincidencia.length; 
            return coincidencia; 
          }); 
          fragmento.appendChild(document.createTextNode(nodo.nodeValue.slice(ultimo))); 
          nodo.replaceWith(fragmento); 
        }); 
        return contenedor.innerHTML; 
      } 
      function campo(etiqueta, valor, clase = "", dependencia = false) {

      function puntuarPregunta(pregunta, registro) { 
        const palabras = normalizar(pregunta) 
          .split(" ") 
          .filter((palabra) => palabra.length > 2); 
        const secciones = { 
          nombre: normalizar(registro.nombre), 
          contenido: normalizar( 
            [ 
              registro.producto, 
              registro.pais, 
              registro.valores, 
              registro.que, 
              registro.como, 
              textoPlano(registro.dependencias), 
              registro.cuando, 
              registro.ejemplo, 
              registro.notas, 
            ].join(" "), 
          ), 
        }; 
 
        return palabras.reduce((total, palabra) => { 
          if (secciones.nombre.includes(palabra)) return total + 5; 
          if (secciones.contenido.includes(palabra)) return total + 2; 
          return total; 
        }, 0); 
      }

      function base64Unicode(valor) { 
        const bytes = new TextEncoder().encode(valor); 
        let binario = ""; 
        for (let i = 0; i < bytes.length; i += 32768) {

aquete.registros,textos=paquete.textos;const esc=function(v){return String(v==null?\"\":v).replace(/[&<>\"']/g,function(m){return{\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#039;\"}[m]})};const plano=function(v){const d=document.createElement(\"div\");d.innerHTML=String(v==null?\"\":v);return d.textContent||\"\"};const normalizar=function(v){return String(v==null?\"\":v).toLowerCase().normalize(\"NFD\").replace(/[\\u0300-\\u036f]/g,\"\").replace(/[^a-z0-9]+/g,\" \").trim()};const clave=function(r){return r.id||(\"op\"+r.__opcion+\"-\"+normalizar(r.nombre).replaceAll(\" \",\"-\"))};const buscar=function(id){return registros.find(function(r){return r.id===id||clave(r)===id||(\"op\"+r.__opcion+\"-\"+normalizar(r.nombre).replaceAll(\" \",\"-\"))===id})};const campo=function(t,v,html){return '<section class=\"campo\"><b>'+esc(t)+'</b><div>'+(html?String(v||\"—\"):esc(plano(v)||\"—\"))+'</div></section>'};function render(r){document.getElementById(\"app\").innerHTML='<article class=\"ficha\"><div class=\"codigo\">Op. '+esc(r.__opcion||r.codigo||\"\")+'</div><h1 class=\"nombre\">'+esc(r.nombre||\"\")+'</h1><div class=\"campos\">'+campo(textos.producto,r.producto)+campo(textos.pais,r.pais)+campo(textos.valores,r.valores)+campo(textos.que,r.que||r.descripcion)+campo(textos.como,r.como)+campo(textos.dependencias,r.dependencias||r.dep,true)+campo(textos.cuando,r.cuando)+campo(textos.ejemplo,r.ejemplo)+campo(textos.notas,r.notas)+'</div></article>'}function mostrar(a){const r=buscar(a.dataset.target);if(!r)return;const v=document.getElementById(\"vista\"),rect=a.getBoundingClientRect();const fila=function(t,x){return '<div class=\"fila\"><b>'+esc(t)+'</b>'+esc(plano(x)||\"—\")+'</div>'};v.innerHTML='<h4>'+esc(r.nombre)+'</h4><p>Op. '+esc(r.__opcion||r.codigo||\"\")+'</p>'+fila(textos.producto,r.producto)+fila(textos.pais,r.pais)+fila(textos.valores,r.valores)+fila(textos.que,r.que)+fila(textos.como,r.como)+fila(textos.dependencias,r.dependencias||r.dep)+fila(textos.cuando,r.cuando)+fila(textos.ejemplo,r.ejemplo)+fila(textos.notas,r.notas)+'<button class=\"boton\" data-abrir=\"'+esc(clave(r))+'\">'+esc(textos.abrir)+'</button>';v.style.display=\"block\";v.style.left=Math.max(6,Math.min(rect.left,innerWidth-v.offsetWidth-12))+\"px\";v.style.top=Math.max(6,Math.min(rect.bottom+8,innerHeight-v.offsetHeight-12))+\"px\"}document.addEventListener(\"mouseover\",function(e){const a=e.target.closest&&e.target.closest(\".dep-ref-inline\");if(a)mostrar(a)});document.addEventListener(\"click\",function(e){const a=e.target.closest&&e.target.closest(\".dep-ref-inline\");if(a){e.preventDefault();mostrar(a)}const b=e.target.closest&&e.target.closest(\"[data-abrir]\");if(b){const r=buscar(b.dataset.abrir);if(r){const w=open(\"\",\"_blank\");if(w){w.document.write(document.documentElement.outerHTML);w.document.close();setTimeout(function(){w.postMessage({tipo:\"mostrar\",id:clave(r)},\"*\")},100)}}}});window.addEventListener(\"message\",function(e){if(e.data&&e.data.tipo===\"mostrar\"){const r=buscar(e.data.id);if(r)render(r)}});document.addEventListener(\"pointerdown\",function(e){const v=document.getElementById(\"vista\");if(!v.contains(e.target)&&!(e.target.closest&&e.target.closest(\".dep-ref-inline\")))v.style.display=\"none\"});render(paquete.inicial);<\\/script></body></html>"

      function activarArrastre() { 
        const panel = $("panelPreguntas"); 
        const cabecera = $("panelCabecera"); 
        let desplazamientoX = 0; 
        let desplazamientoY = 0; 
        let arrastrando = false; 
 
        cabecera.addEventListener("pointerdown", (evento) => { 
          if (evento.target.closest("button")) return; 
          const rect = panel.getBoundingClientRect(); 
          desplazamientoX = evento.clientX - rect.left; 
          desplazamientoY = evento.clientY - rect.top;

          cabecera.setPointerCapture(evento.pointerId); 
          panel.style.right = "auto"; 
          panel.style.bottom = "auto";

        cabecera.addEventListener("pointermove", (evento) => { 
          if (!arrastrando) return; 
          const izquierda = Math.max( 
            0, 
            Math.min( 
              window.innerWidth - panel.offsetWidth, 
              evento.clientX - desplazamientoX, 
            ), 
          ); 
          const arriba = Math.max( 
            0, 
            Math.min(window.innerHeight - 50, evento.clientY - desplazamientoY), 
          ); 
          panel.style.left = `${izquierda}px`; 
          panel.style.top = `${arriba}px`; 
        }); 
 
        cabecera.addEventListener("pointerup", () => { 
          arrastrando = false; 
        }); 
      }
